[project]
name = "constitbrief"
version = "2.0.0"
description = "Live intake assistant for electorate office conversations"
requires-python = ">=3.12"
# Keep in step with requirements.txt.
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[tool.vercel]
# The app lives in a package, not at a default root-level entrypoint.
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.uv]
# Application, not a library: install dependencies only.
package = false
